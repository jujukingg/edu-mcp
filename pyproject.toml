[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edu-mcp"
version = "1.0.0"
description = "Unified Model Context Protocol (MCP) server for French school platforms (Pronote, ÉcoleDirecte, Skolengo, ENT)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Edu MCP Contributors" }]
keywords = ["mcp", "pronote", "ecoledirecte", "skolengo", "education", "school"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=2.0.0",
    "pronotepy>=2.11.0",
    "ecoledirecte-py-client>=0.2.1",
    "httpx>=0.28.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "truststore>=0.10.0",
    "playwright>=1.40.0",
    "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
edu-mcp = "edu_mcp.__main__:main"
pronote-mcp = "edu_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/jujukingg/edu-mcp"
Repository = "https://github.com/jujukingg/edu-mcp"
Issues = "https://github.com/jujukingg/edu-mcp/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--cov=edu_mcp --cov-report=term-missing --cov-fail-under=80"
