[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pronote-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) server for Pronote, enabling AI assistants like Antigravity Gemini and Claude Desktop to interact with Pronote"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pronote MCP Contributors" }]
dependencies = [
    "mcp>=2.0.0",
    "pronotepy>=2.11.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "truststore>=0.10.0",
    "playwright>=1.40.0",
    "opencv-python-headless>=4.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
pronote-mcp = "pronote_mcp.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--cov=pronote_mcp --cov-report=term-missing --cov-fail-under=80"
